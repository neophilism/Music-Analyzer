[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "music-analyzer-desktop"
version = "0.1.0"
description = "A local native workspace for instrumental analysis and album sequencing"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "numpy>=2.2,<3", "scipy>=1.15,<2", "librosa==0.11.0",
  "soundfile==0.13.1", "PySide6==6.10.3", "platformdirs>=4,<5",
]

[project.optional-dependencies]
models = ["torch==2.10.0", "transformers==4.57.6", "huggingface-hub>=0.34,<1", "safetensors>=0.6,<1"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "pyloudnorm==0.2.0", "pyinstaller>=6.16,<7"]

[project.scripts]
music-analyzer = "music_analyzer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
music_analyzer = ["resources/*.json", "resources/*.txt", "resources/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["model: requires the installed pinned model", "benchmark: slower performance checks"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
