name: Signed Mac review build (manual)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full reviewed commit SHA to build
        required: true
        type: string
permissions:
  contents: read
jobs:
  signed-review:
    runs-on: macos-14
    timeout-minutes: 50
    env:
      QT_QPA_PLATFORM: offscreen
      OMP_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install -e '.[dev,models]'
      - name: Check reviewed source
        env:
          REVIEWED_SHA: ${{ inputs.source_sha }}
        run: |
          python -c 'import os,re,subprocess; sha=os.environ["REVIEWED_SHA"]; assert re.fullmatch("[0-9a-fA-F]{40}",sha) and subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip().lower()==sha.lower(), "Supply the full reviewed commit SHA"'
          python -m ruff check .
          python -m pytest
          python packaging/collect_notices.py
      - name: Build, sign, notarize, staple, and verify
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          MUSIC_ANALYZER_CODESIGN_IDENTITY: ${{ secrets.MUSIC_ANALYZER_CODESIGN_IDENTITY }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: bash packaging/signed_review.sh
      - name: Install pinned model and verify signed package offline
        run: |
          "dist/Music Analyzer.app/Contents/MacOS/MusicAnalyzer" --install-model model-pack
          HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 "dist/Music Analyzer.app/Contents/MacOS/MusicAnalyzer" --verify-package --model-directory "$PWD/model-pack" --verification-report artifacts/signed-frozen-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-signed-review
          path: artifacts/
          retention-days: 30
